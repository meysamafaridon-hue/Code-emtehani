<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه من</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            direction: rtl;
            text-align: center;
            padding: 50px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 300px;
            margin: auto;
            box-shadow: 0 5px 20px #cccccc;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
            line-height: 1.8;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>فروشگاه من</h1>
        <p>به فروشگاه ما خوش آمدید! بهترین محصولات را با بهترین قیمت پیدا کنید.</p>
        <button>مشاهده محصولات</button>
    </div>

</body>
</html>
