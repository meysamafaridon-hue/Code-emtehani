# Base44 sandbox environment for the MCI MARCT storefront (Vite + React + TS).
#
# The app runs FROM THE CLONED SOURCE via a Vite dev server with live reload,
# so edits appear in the preview without a rebuild. Dependencies are installed
# from the lockfile on container startup. No external services or credentials
# are required.
services:
  web:
    image: node:22-alpine
    restart: on-failure
    ports:
      - "3000:5173"
    working_dir: /app
    volumes:
      - ./:/app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    labels:
      base44.project: "MCI MARCT"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
